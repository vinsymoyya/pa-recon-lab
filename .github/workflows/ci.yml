name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    name: Contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU runtime and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . build
      - name: Check research software contracts
        run: python -m unittest discover -s tests -v
      - name: Check generated notebook matches the package
        run: python scripts/build_kaggle_notebook.py --check
      - name: Build distributable package
        run: python -m build
