name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    name: Contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: windows-2025
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU runtime and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . build
      - name: Check research software contracts
        run: python scripts/check_reliability.py --expected 45
      - name: Check generated notebook matches the package
        run: python scripts/build_kaggle_notebook.py --check
      - name: Check acquisition notebook matches the package
        run: python scripts/build_acquisition_notebook.py --check
      - name: Build distributable package
        run: python -m build
