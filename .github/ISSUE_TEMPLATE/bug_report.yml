name: Bug report
description: Report a reproducible software failure.
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal command or example
      description: Include shapes, keys, package revision, Python/PyTorch versions and device. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error output and experiment manifest
      description: Share only non-sensitive, relevant excerpts.
