[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-recon-lab"
version = "0.1.0"
description = "Reproducible synthetic photoacoustic reconstruction and acquisition stress evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "h5py>=3.10", "torch>=2.2"]
keywords = ["photoacoustic", "reconstruction", "inverse-problems", "pytorch", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Repository = "https://github.com/vinsymoyya/pa-recon-lab"
Issues = "https://github.com/vinsymoyya/pa-recon-lab/issues"
Documentation = "https://github.com/vinsymoyya/pa-recon-lab/blob/main/docs/USAGE.md"

[project.scripts]
pa-recon = "pa_recon.cli:main"

[tool.setuptools.packages.find]
include = ["pa_recon*"]
